name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Huff compiler
        run: |
          sudo curl -L https://github.com/huff-language/huffc/releases/latest/download/huffc-x86_64-unknown-linux-gnu -o /usr/local/bin/huffc
          sudo chmod +x /usr/local/bin/huffc
          huffc --version

      - name: Verify Huff files exist
        run: |
          ls -la src/HorseStoreV2/
          ls -la src/horseStoreV1/

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test
