name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Huff compiler
        run: |
          curl -L https://raw.githubusercontent.com/huff-language/huff-rs/main/huffup/huffup -o huffup
          chmod +x huffup
          ./huffup
          echo "$HOME/.huff/bin" >> $GITHUB_PATH

      - name: Verify Huff installation
        run: huffc --version

      - name: Verify Huff files exist
        run: |
          ls -la src/HorseStoreV2/
          ls -la src/horseStoreV1/

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test
